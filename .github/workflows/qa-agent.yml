name: QA

on:
  workflow_dispatch:
  pull_request:
    types: [assigned, opened, synchronize, reopened]

jobs:
  qa:
    uses: jvictor96/QA-agent/.github/workflows/qa-agent.yml@main
    with:
      reasoning_model: gpt-5-mini
      target_branch: master
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}